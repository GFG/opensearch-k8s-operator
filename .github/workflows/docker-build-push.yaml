name: "Docker Build Push"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  SERVER_IMAGE: europe-west1-docker.pkg.dev/datajet-production/datajet-prod-euw1-docker-gcr/opensearch-k8s-operator

jobs:
  docker-build-push:
    # The Go toolchain lives inside the Dockerfile's builder stage, so the runner
    # only needs docker, buildx and gcloud -- all present on ubuntu-latest.
    runs-on: ubuntu-latest
    name: Docker Build Push
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up GCP auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/221333776893/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-sa@datajet-platform.iam.gserviceaccount.com'
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          version: '>= 363.0.0'
          install_components: 'docker-credential-gcr'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # No QEMU: the builder stage is pinned to $BUILDPLATFORM and Go cross-compiles
      # via GOOS/GOARCH, and the runtime stage has no RUN. Nothing ever executes at
      # the target architecture, so binfmt emulation is not needed for either platform.

      - name: Extract metadata for Server
        id: meta-server
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Gcloud configure docker for europe-west1-docker.pkg.dev
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Copy LICENSE into build context
        run: cp LICENSE opensearch-operator/LICENSE

      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./opensearch-operator
          file: ./opensearch-operator/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=registry,ref=${{ env.SERVER_IMAGE }}:buildcache
          # Pull requests read the shared cache but must not write to it, otherwise
          # a PR build could poison the cache that main later builds from.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.SERVER_IMAGE) || '' }}
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Server Image Digest: ${DIGEST:-<not pushed>}"
